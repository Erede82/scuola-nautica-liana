<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Scuola Nautica Liana — area studenti e gestionale.">
  <meta name="theme-color" content="#005E83">

  <!-- iOS / installable web app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nautica Liana">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Scuola Nautica Liana</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* Fallback scuro (no blu pieno) se l'immagine Welcome non è ancora pronta. */
      background-color: #0A1620;
      overflow: hidden;
    }
    /*
      Static Welcome shell (PWA.7-Z1): stessa hero della Welcome reale.
      Solo rendering — pointer-events:none su tutto il nodo.
      Gradient overlay: 0.72 → 0.62 → 0.55 → 0.48 (come Flutter hero).
    */
    #liana-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      box-sizing: border-box;
      padding:
        env(safe-area-inset-top, 0px)
        env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px)
        env(safe-area-inset-left, 0px);
      background-color: #0A1620;
      background-image:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.72) 0%,
          rgba(0, 0, 0, 0.62) 35%,
          rgba(0, 0, 0, 0.55) 65%,
          rgba(0, 0, 0, 0.48) 100%
        ),
        url("assets/assets/images/welcome/welcome_boat.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      font-family: Helvetica, Arial, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    .liana-splash-inner {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 24px;
      box-sizing: border-box;
      pointer-events: none;
    }
    .liana-splash-logo {
      align-self: flex-start;
      height: 70px;
      width: auto;
      display: block;
      filter: drop-shadow(0 5px 26px rgba(0, 0, 0, 0.52));
      pointer-events: none;
    }
    .liana-splash-copy {
      margin-top: 24px;
      text-align: center;
      pointer-events: none;
    }
    .liana-splash-title {
      margin: 0;
      font-size: clamp(32px, 10.5vw, 40px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0.2px;
      pointer-events: none;
    }
    .liana-splash-subtitle {
      margin: 12px 0 0;
      font-size: clamp(16px, 4.4vw, 17px);
      font-weight: 500;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.94);
      pointer-events: none;
    }
    .liana-splash-editorial {
      margin: 12px 0 0;
      font-size: clamp(13px, 3.6vw, 14px);
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.88);
      pointer-events: none;
    }
    .liana-splash-cta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 22px;
      pointer-events: none;
    }
    .liana-splash-cta {
      display: inline-block;
      box-sizing: border-box;
      padding: 18px 28px;
      border: 1.2px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      pointer-events: none;
    }
    .liana-splash-forgot {
      display: inline-block;
      margin: 12px 0 0;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.88);
      pointer-events: none;
    }
    .liana-splash-discover {
      display: inline-block;
      box-sizing: border-box;
      margin-top: 20px;
      padding: 14px 22px;
      border: 1.2px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.05px;
      line-height: 1.2;
      pointer-events: none;
    }
    @media (max-height: 719px) {
      .liana-splash-inner {
        padding: 12px 24px;
      }
      .liana-splash-logo {
        height: 56px;
      }
      .liana-splash-copy {
        margin-top: 12px;
      }
      .liana-splash-discover {
        margin-top: 14px;
      }
    }
  </style>
</head>
<body>
  <!--
    Cold-start guard (prima di flutter_bootstrap.js):
    1) root hashless `/` → `/#/` (root Flutter canonica)
    2) stale `#/forgot-password` → `/#/`
    I segnali Auth/recovery reali (token in hash/query) restano intatti.
    Idempotente: `/#/`, `/#/login`, `/#/register` → no-op.
  -->
  <script>
    (function () {
      try {
        var hash = location.hash || '';
        var search = location.search || '';
        var pathname = location.pathname || '/';
        var hasAuthPayload =
          /(?:^|[&#?])(?:access_token|refresh_token|type=recovery|type%3Drecovery|code)=/i.test(
            hash + search
          );
        if (hasAuthPayload) return;

        var staleForgot =
          /^#\/?forgot-password\/?(?:\?.*)?$/i.test(hash) ||
          /^\/forgot-password\/?$/i.test(pathname);
        if (staleForgot) {
          var cleanPath = pathname.replace(/\/forgot-password\/?$/i, '/');
          if (!cleanPath || cleanPath === '') cleanPath = '/';
          history.replaceState(null, '', cleanPath + (search || '') + '#/');
          return;
        }

        // Root hashless → root hash Flutter (niente loop su /#/).
        var hashEmpty = !hash || hash === '#';
        var atRoot = pathname === '/' || pathname === '';
        if (atRoot && hashEmpty) {
          history.replaceState(null, '', (pathname || '/') + (search || '') + '#/');
        }
      } catch (_) {}
    })();
  </script>

  <div id="liana-splash" aria-hidden="true">
    <div class="liana-splash-inner">
      <img
        class="liana-splash-logo"
        src="assets/assets/branding/logo_mark_white.png"
        alt=""
        width="70"
        height="70"
        decoding="async"
      />
      <div class="liana-splash-copy">
        <h1 class="liana-splash-title">Scuola Nautica Liana</h1>
        <p class="liana-splash-subtitle">
          Benvenuto, sei pronto a navigare con noi?
        </p>
        <p class="liana-splash-editorial">
          Un'esperienza di studio che parte dalla scuola e guarda subito al mare.
        </p>
        <div class="liana-splash-cta-row">
          <span class="liana-splash-cta">Accedi</span>
          <span class="liana-splash-cta">Registrati</span>
        </div>
        <p class="liana-splash-forgot">Password dimenticata?</p>
        <span class="liana-splash-discover">SCOPRICI</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      function removeSplash() {
        var el = document.getElementById('liana-splash');
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
      window.addEventListener('flutter-first-frame', removeSplash, { once: true });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
