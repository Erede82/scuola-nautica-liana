<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Scuola Nautica Liana — area studenti e gestionale.">
  <meta name="theme-color" content="#005E83">

  <!-- iOS / installable web app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nautica Liana">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Scuola Nautica Liana</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #005E83;
      overflow: hidden;
    }
    /* Splash pre-Flutter: full viewport, safe-area iOS, no remote assets. */
    #liana-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding:
        env(safe-area-inset-top, 0px)
        env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px)
        env(safe-area-inset-left, 0px);
      background-color: #005E83;
      pointer-events: none;
    }
    #liana-splash img {
      width: min(42vw, 168px);
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <!--
    Cold-start guard: una route Flutter stale `#/forgot-password` non deve
    ripristinarsi al normale avvio. I segnali Auth/recovery reali (token in
    hash/query) restano intatti.
  -->
  <script>
    (function () {
      try {
        var hash = location.hash || '';
        var search = location.search || '';
        var hasAuthPayload =
          /(?:^|[&#?])(?:access_token|refresh_token|type=recovery|type%3Drecovery|code)=/i.test(
            hash + search
          );
        if (hasAuthPayload) return;

        var staleForgot =
          /^#\/?forgot-password\/?(?:\?.*)?$/i.test(hash) ||
          /^\/forgot-password\/?$/i.test(location.pathname);
        if (!staleForgot) return;

        var cleanPath =
          location.pathname.replace(/\/forgot-password\/?$/i, '/');
        if (!cleanPath || cleanPath === '') cleanPath = '/';
        history.replaceState(null, '', cleanPath + (search || '') + '#/');
      } catch (_) {}
    })();
  </script>

  <div id="liana-splash" aria-hidden="true">
    <!-- Marchio ufficiale già in web/icons (bianco su #005E83). -->
    <img
      src="icons/Icon-512.png"
      alt=""
      width="168"
      height="168"
      decoding="async"
    />
  </div>

  <script>
    (function () {
      function removeSplash() {
        var el = document.getElementById('liana-splash');
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
      window.addEventListener('flutter-first-frame', removeSplash, { once: true });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
