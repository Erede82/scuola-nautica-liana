  <link

  <style>
    @font-face {

      font-weight: 400;
      font-display: block;
      src: url('assets/google_fonts/Montserrat-Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url('assets/google_fonts/Montserrat-Medium.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 600;
      font-display: block;
      src: url('assets/google_fonts/Montserrat-SemiBold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: url('assets/google_fonts/Montserrat-Bold.ttf') format('truetype');
    }
    /* RELEASE.FINAL: root Navy permanente; Capri solo sull'overlay splash. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #005E83;
      overflow: hidden;
    }
    /* RELEASE.IOS-SENTINEL: fascia Navy 16px solo iOS standalone (sotto splash). */
    #liana-ios-status-sentinel {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 16px;
      background: #005E83;
      pointer-events: none;
      z-index: 9500;
    }
    #liana-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      box-sizing: border-box;
      background-color: #00BFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
      font-family: 'Montserrat', Helvetica, Arial, sans-serif;
      color: #fff;
    }
    .liana-splash-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    #liana-splash img {
      height: 100px;
      width: auto;
      display: block;
      pointer-events: none;
    }
    .liana-splash-title {
      margin: 24px 0 0;
      padding: 0 24px;
      font-size: clamp(18px, 5.2vw, 22px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.2px;
      text-align: center;
      color: #fff;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!--
    Cold-start guard (prima di flutter_bootstrap.js):
    1) root hashless `/` → `/#/` (root Flutter canonica)
    2) stale `#/forgot-password` → `/#/`
    I segnali Auth/recovery reali (token in hash/query) restano intatti.
    Idempotente: `/#/`, `/#/login`, `/#/register` → no-op.
  -->
  <script>
    (function () {
      try {
        var hash = location.hash || '';
        var search = location.search || '';
        var pathname = location.pathname || '/';
        var hasAuthPayload =
          /(?:^|[&#?])(?:access_token|refresh_token|type=recovery|type%3Drecovery|code)=/i.test(
            hash + search
          );
        if (hasAuthPayload) return;

        var staleForgot =
          /^#\/?forgot-password\/?(?:\?.*)?$/i.test(hash) ||
          /^\/forgot-password\/?$/i.test(pathname);
        if (staleForgot) {
          var cleanPath = pathname.replace(/\/forgot-password\/?$/i, '/');
          if (!cleanPath || cleanPath === '') cleanPath = '/';
          history.replaceState(null, '', cleanPath + (search || '') + '#/');
          return;
        }

        // Root hashless → root hash Flutter (niente loop su /#/).
        var hashEmpty = !hash || hash === '#';
        var atRoot = pathname === '/' || pathname === '';
        if (atRoot && hashEmpty) {
          history.replaceState(null, '', (pathname || '/') + (search || '') + '#/');
        }
      } catch (_) {}
    })();
  </script>

  <!--
    RELEASE.IOS-SENTINEL: Navy 16px per status bar iOS Home Screen.
    display:none di default; ON solo iOS + standalone (script sotto).
    z-index 9500 < splash 9999 → Capri intro resta full-screen.
  -->
  <div id="liana-ios-status-sentinel" aria-hidden="true"></div>

  <!--
    STARTUP.DECISIVE: Capri + logo + titolo.
    Rimozione SOLO da Flutter (WELCOME_VISUAL_READY ∧ 1500ms).
    Nessuna rimozione a flutter-first-frame.
  -->
  <div id="liana-splash" aria-hidden="true">
    <div class="liana-splash-brand">
      <img
        src="assets/assets/branding/logo_mark_white.png"
        alt=""
        width="100"
        height="100"
        decoding="async"
      />
      <p class="liana-splash-title">Scuola Nautica Liana</p>
    </div>
  </div>

  <script>
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isStandalone =
          (window.matchMedia &&
            window.matchMedia('(display-mode: standalone)').matches) ||
          navigator.standalone === true;
        if (isIOS && isStandalone) {
          var el = document.getElementById('liana-ios-status-sentinel');
          if (el) el.style.setProperty('display', 'block');
        }
      } catch (_) {}
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
